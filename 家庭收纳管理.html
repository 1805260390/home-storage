<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家庭收纳管理</title>
<style>
/* SECTION: reset & base */
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4CAF50;--primary-dark:#388E3C;--primary-light:#C8E6C9;--danger:#E53935;--danger-light:#FFCDD2;--bg:#F5F7F5;--card:#FFF;--text:#333;--text-secondary:#777;--border:#E8E8E8;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
a{color:var(--primary);text-decoration:none}

/* SECTION: header */
.header{background:var(--primary);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:600}
.header .back-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px 8px;margin-left:-8px;display:flex;align-items:center}
.header .back-btn:active{opacity:.7}

/* SECTION: login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px}
.login-box{background:var(--card);border-radius:var(--radius);padding:32px 24px;box-shadow:var(--shadow);width:100%;max-width:360px;text-align:center}
.login-box h2{font-size:20px;margin-bottom:8px}
.login-box p{font-size:13px;color:var(--text-secondary);margin-bottom:20px}
.login-box input{width:100%;padding:14px;border:2px solid var(--border);border-radius:8px;font-size:18px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:16px}
.login-box input:focus{border-color:var(--primary)}
.login-box button{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.login-box .err{color:var(--danger);font-size:13px;margin-top:-10px;margin-bottom:10px}

/* SECTION: location list */
.location-list{padding:16px}
.location-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:space-between}
.location-card:active{transform:scale(.98)}
.location-card .info{flex:1;min-width:0}
.location-card .name{font-size:16px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.location-card .desc{font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.location-card .count{font-size:12px;color:var(--primary);margin-top:4px}
.location-card .actions{display:flex;gap:8px;margin-left:12px;flex-shrink:0}
.location-card .actions button{width:36px;height:36px;border:none;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.btn-edit{background:var(--primary-light);color:var(--primary-dark)}
.btn-delete{background:var(--danger-light);color:var(--danger)}
.btn-qr{background:#E3F2FD;color:#1976D2}

/* SECTION: empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:64px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:15px;margin-bottom:20px}

/* SECTION: bottom action bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.08);display:flex;gap:12px;z-index:100}
.bottom-bar button{flex:1;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.bottom-bar button:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}

/* SECTION: item list */
.item-list{padding:16px}
.item-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}
.item-card .item-info{flex:1;min-width:0}
.item-card .item-name{font-size:15px;font-weight:500}
.item-card .item-qty{font-size:13px;color:var(--primary);margin-top:2px}
.item-card .item-note{font-size:12px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-card .actions{display:flex;gap:8px;margin-left:12px;flex-shrink:0}
.item-card .actions button{width:34px;height:34px;border:none;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* SECTION: modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .25s ease-out}
.modal-overlay.active .modal{transform:translateY(0)}
.modal h2{font-size:18px;margin-bottom:20px;text-align:center}
.modal label{display:block;font-size:14px;color:var(--text-secondary);margin-bottom:6px;margin-top:14px}
.modal input,.modal textarea,.modal select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;transition:border-color .2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--primary)}
.modal textarea{resize:vertical;min-height:60px}
.modal .modal-actions{display:flex;gap:12px;margin-top:24px}
.modal .modal-actions button{flex:1;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer}

/* SECTION: QR code */
.qr-container{text-align:center;padding:40px 20px}
.qr-container .qr-name{font-size:18px;font-weight:600;margin-bottom:16px}
.qr-container .qr-box{display:inline-block;background:#fff;padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.qr-container .qr-tip{font-size:13px;color:var(--text-secondary);margin-top:12px}

/* SECTION: confirm dialog */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.active{opacity:1;pointer-events:auto}
.confirm-box{background:#fff;border-radius:var(--radius);padding:24px;width:280px;text-align:center}
.confirm-box p{font-size:15px;margin-bottom:20px}
.confirm-box .confirm-actions{display:flex;gap:12px}
.confirm-box .confirm-actions button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* SECTION: toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:400;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* SECTION: loading */
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary);font-size:15px}
.loading::after{content:'';display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* SECTION: responsive */
@media(min-width:600px){
.location-list,.item-list{max-width:560px;margin:0 auto}
.modal{border-radius:20px;margin-bottom:20vh}
}
</style>
</head>
<body>

<!-- SECTION: toast -->
<div class="toast" id="toast"></div>

<!-- SECTION: confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeConfirm()">取消</button>
      <button style="background:var(--danger);color:#fff" id="confirmBtn" onclick="doConfirm()">确定</button>
    </div>
  </div>
</div>

<!-- SECTION: modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modalContent"></div>
</div>

<!-- SECTION: app container -->
<div id="app"><div class="loading">加载中</div></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
/* SECTION: config */
const API_BASE = '';  // same origin
const PASSCODE_KEY = 'storage_passcode';

/* SECTION: data layer - server-backed */
let appData = { locations: [] };
let _saving = false;
let _dirty = false;

async function loadData() {
  try {
    const resp = await fetch(API_BASE + '/api/data');
    if (resp.ok) {
      const data = await resp.json();
      if (data && data.locations) return data;
    }
  } catch(e) {}
  return { locations: [] };
}

async function saveData(data) {
  if (_saving) { _dirty = true; return; }
  _saving = true;
  try {
    await fetch(API_BASE + '/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch(e) {
    showToast('保存失败，请检查网络');
  }
  _saving = false;
  if (_dirty) { _dirty = false; saveData(data); }
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* SECTION: router */
function getHashRoute() {
  const hash = location.hash.slice(1);
  if (!hash || hash === '/') return { page: 'home' };
  const parts = hash.split('/');
  if (parts[1] === 'location' && parts[2]) return { page: 'location', id: parts[2] };
  if (parts[1] === 'qr' && parts[2]) return { page: 'qr', id: parts[2] };
  return { page: 'home' };
}

function navigate(hash) { location.hash = hash; }

window.addEventListener('hashchange', render);

/* SECTION: passcode auth */
function isLoggedIn() {
  return sessionStorage.getItem(PASSCODE_KEY) === 'ok';
}

function renderLogin(container) {
  container.innerHTML = `<div class="header"><h1>🏠 家庭收纳管理</h1></div>
  <div class="login-wrap">
    <div class="login-box">
      <h2>🔐 输入密码</h2>
      <p>首次使用请设置密码，之后所有设备用同一密码登录</p>
      <input id="passcodeInput" type="password" placeholder="输入密码" maxlength="20"
        onkeydown="if(event.key==='Enter')doLogin()">
      <div class="err" id="loginErr"></div>
      <button data-primary-action onclick="doLogin()">进入</button>
    </div>
  </div>`;
  setTimeout(() => document.getElementById('passcodeInput').focus(), 200);
}

async function doLogin() {
  const code = document.getElementById('passcodeInput').value.trim();
  if (!code) { document.getElementById('loginErr').textContent = '请输入密码'; return; }

  // Check server for existing passcode
  try {
    const resp = await fetch(API_BASE + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const result = await resp.json();
    if (result.ok) {
      sessionStorage.setItem(PASSCODE_KEY, 'ok');
      await initApp();
    } else {
      document.getElementById('loginErr').textContent = result.error || '密码错误';
    }
  } catch(e) {
    document.getElementById('loginErr').textContent = '连接服务器失败';
  }
}

async function initApp() {
  document.getElementById('app').innerHTML = '<div class="loading">加载中</div>';
  appData = await loadData();
  render();
}

/* SECTION: toast & confirm */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

let confirmCallback = null;
function showConfirm(msg, cb) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOverlay').classList.add('active');
  confirmCallback = cb;
}
function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('active');
  confirmCallback = null;
}
function doConfirm() {
  if (confirmCallback) confirmCallback();
  closeConfirm();
}

/* SECTION: modal */
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}
function closeModalOnOverlay(e) {
  if (e.target === e.currentTarget) closeModal();
}

/* SECTION: render engine */
function render() {
  if (!isLoggedIn()) { renderLogin(document.getElementById('app')); return; }
  const route = getHashRoute();
  const app = document.getElementById('app');
  switch(route.page) {
    case 'home': renderHome(app); break;
    case 'location': renderLocation(app, route.id); break;
    case 'qr': renderQR(app, route.id); break;
    default: renderHome(app);
  }
}

/* SECTION: home page */
function renderHome(container) {
  const locs = appData.locations;
  let html = `<div class="header"><h1>🏠 家庭收纳管理</h1>
    <button style="background:none;border:none;color:#fff;font-size:14px;cursor:pointer" onclick="logout()">退出</button>
  </div>`;

  if (locs.length === 0) {
    html += `<div class="empty-state">
      <div class="icon">📦</div>
      <p>还没有收纳位置，点击下方添加吧</p>
    </div>`;
  } else {
    html += `<div class="location-list">`;
    locs.forEach(loc => {
      const count = loc.items ? loc.items.length : 0;
      html += `<div class="location-card" onclick="navigate('/location/${loc.id}')">
        <div class="info">
          <div class="name">${esc(loc.name)}</div>
          ${loc.desc ? `<div class="desc">${esc(loc.desc)}</div>` : ''}
          <div class="count">${count} 件物品</div>
        </div>
        <div class="actions" onclick="event.stopPropagation()">
          <button class="btn-qr" onclick="navigate('/qr/${loc.id}')" title="二维码">📱</button>
          <button class="btn-edit" onclick="editLocation('${loc.id}')" title="编辑">✏️</button>
          <button class="btn-delete" onclick="deleteLocation('${loc.id}')" title="删除">🗑️</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="bottom-bar">
    <button class="btn-primary" data-primary-action onclick="addLocation()">+ 添加收纳位置</button>
  </div>`;

  container.innerHTML = html;
}

function logout() {
  sessionStorage.removeItem(PASSCODE_KEY);
  render();
}

/* SECTION: location detail */
function renderLocation(container, locId) {
  const loc = appData.locations.find(l => l.id === locId);
  if (!loc) { navigate('/'); return; }

  const items = loc.items || [];
  let html = `<div class="header">
    <button class="back-btn" onclick="navigate('/')">←</button>
    <h1>${esc(loc.name)}</h1>
    <div style="width:40px"></div>
  </div>`;

  if (loc.desc) {
    html += `<div style="padding:12px 16px 0;font-size:13px;color:var(--text-secondary)">${esc(loc.desc)}</div>`;
  }

  if (items.length === 0) {
    html += `<div class="empty-state">
      <div class="icon">📋</div>
      <p>这个位置还没有物品</p>
    </div>`;
  } else {
    html += `<div class="item-list">`;
    items.forEach(item => {
      html += `<div class="item-card">
        <div class="item-info">
          <div class="item-name">${esc(item.name)}</div>
          ${item.qty > 1 ? `<div class="item-qty">×${item.qty}</div>` : ''}
          ${item.note ? `<div class="item-note">${esc(item.note)}</div>` : ''}
        </div>
        <div class="actions">
          <button class="btn-edit" onclick="editItem('${locId}','${item.id}')" title="编辑">✏️</button>
          <button class="btn-delete" onclick="deleteItem('${locId}','${item.id}')" title="删除">🗑️</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="bottom-bar">
    <button class="btn-primary" data-primary-action onclick="addItem('${locId}')">+ 添加物品</button>
  </div>`;

  container.innerHTML = html;
}

/* SECTION: QR code page - simple URL-based QR */
function renderQR(container, locId) {
  const loc = appData.locations.find(l => l.id === locId);
  if (!loc) { navigate('/'); return; }

  // QR just contains the URL to this location - simple and easy to scan
  const qrUrl = location.origin + location.pathname + '#/location/' + locId;

  let html = `<div class="header">
    <button class="back-btn" onclick="navigate('/location/${locId}')">←</button>
    <h1>收纳二维码</h1>
    <div style="width:40px"></div>
  </div>`;

  html += `<div class="qr-container">
    <div class="qr-name">${esc(loc.name)}</div>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-tip">手机扫码即可查看和管理物品清单</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px">
      手机需要输入相同密码登录 · 所有设备数据实时同步
    </div>
    <div style="margin-top:20px">
      <button class="btn-primary" style="padding:12px 24px;border:none;border-radius:8px;font-size:14px;cursor:pointer" onclick="printQR()">🖨️ 打印二维码</button>
    </div>
  </div>`;

  container.innerHTML = html;

  if (typeof QRCode !== 'undefined') {
    new QRCode(document.getElementById('qrBox'), {
      text: qrUrl,
      width: 220,
      height: 220,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    document.getElementById('qrBox').innerHTML = '<p style="color:var(--danger);font-size:13px">二维码库加载中，请刷新页面</p>';
  }
}

function printQR() {
  const loc = appData.locations.find(l => l.id === getHashRoute().id);
  if (!loc) return;
  const qrBox = document.getElementById('qrBox');
  const canvas = qrBox.querySelector('canvas');
  const img = qrBox.querySelector('img');
  let imgSrc = '';
  if (canvas) imgSrc = canvas.toDataURL();
  else if (img) imgSrc = img.src;

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>${esc(loc.name)} - 二维码</title><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}h2{margin-bottom:20px}img{width:220px;height:220px}p{color:#777;font-size:13px;margin-top:12px}</style></head><body><h2>${esc(loc.name)}</h2>${imgSrc ? `<img src="${imgSrc}">` : '<p>二维码生成失败</p>'}<p>扫码管理物品清单</p></body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

/* SECTION: location CRUD */
function addLocation() {
  openModal(`<h2>添加收纳位置</h2>
    <label>名称 *</label>
    <input id="locName" placeholder="如：主卧衣柜、阳台储物箱" maxlength="30">
    <label>描述（可选）</label>
    <input id="locDesc" placeholder="如：二楼卧室左侧" maxlength="50">
    <div class="modal-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeModal()">取消</button>
      <button style="background:var(--primary);color:#fff" onclick="saveLocation()">添加</button>
    </div>`);
  setTimeout(() => document.getElementById('locName').focus(), 300);
}

function editLocation(id) {
  const loc = appData.locations.find(l => l.id === id);
  if (!loc) return;
  openModal(`<h2>编辑收纳位置</h2>
    <label>名称 *</label>
    <input id="locName" value="${esc(loc.name)}" maxlength="30">
    <label>描述（可选）</label>
    <input id="locDesc" value="${esc(loc.desc || '')}" maxlength="50">
    <div class="modal-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeModal()">取消</button>
      <button style="background:var(--primary);color:#fff" onclick="saveLocation('${id}')">保存</button>
    </div>`);
}

async function saveLocation(id) {
  const name = document.getElementById('locName').value.trim();
  const desc = document.getElementById('locDesc').value.trim();
  if (!name) { showToast('请输入名称'); return; }

  if (id) {
    const loc = appData.locations.find(l => l.id === id);
    if (loc) { loc.name = name; loc.desc = desc; }
    showToast('位置已更新');
  } else {
    appData.locations.push({ id: genId(), name, desc, items: [] });
    showToast('位置已添加');
  }
  await saveData(appData);
  closeModal();
  render();
}

function deleteLocation(id) {
  const loc = appData.locations.find(l => l.id === id);
  if (!loc) return;
  showConfirm(`确定删除「${loc.name}」及其所有物品？`, async () => {
    appData.locations = appData.locations.filter(l => l.id !== id);
    await saveData(appData);
    showToast('已删除');
    render();
  });
}

/* SECTION: item CRUD */
function addItem(locId) {
  openModal(`<h2>添加物品</h2>
    <label>物品名称 *</label>
    <input id="itemName" placeholder="如：冬季羽绒服、备用被子" maxlength="30">
    <label>数量</label>
    <input id="itemQty" type="number" value="1" min="1" max="999">
    <label>备注（可选）</label>
    <textarea id="itemNote" placeholder="如：黑色、S码" maxlength="100"></textarea>
    <div class="modal-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeModal()">取消</button>
      <button style="background:var(--primary);color:#fff" onclick="saveItem('${locId}')">添加</button>
    </div>`);
  setTimeout(() => document.getElementById('itemName').focus(), 300);
}

function editItem(locId, itemId) {
  const loc = appData.locations.find(l => l.id === locId);
  if (!loc) return;
  const item = (loc.items || []).find(i => i.id === itemId);
  if (!item) return;
  openModal(`<h2>编辑物品</h2>
    <label>物品名称 *</label>
    <input id="itemName" value="${esc(item.name)}" maxlength="30">
    <label>数量</label>
    <input id="itemQty" type="number" value="${item.qty || 1}" min="1" max="999">
    <label>备注（可选）</label>
    <textarea id="itemNote" maxlength="100">${esc(item.note || '')}</textarea>
    <div class="modal-actions">
      <button style="background:var(--border);color:var(--text)" onclick="closeModal()">取消</button>
      <button style="background:var(--primary);color:#fff" onclick="saveItem('${locId}','${itemId}')">保存</button>
    </div>`);
}

async function saveItem(locId, itemId) {
  const name = document.getElementById('itemName').value.trim();
  const qty = parseInt(document.getElementById('itemQty').value) || 1;
  const note = document.getElementById('itemNote').value.trim();
  if (!name) { showToast('请输入物品名称'); return; }

  const loc = appData.locations.find(l => l.id === locId);
  if (!loc) return;
  if (!loc.items) loc.items = [];

  if (itemId) {
    const item = loc.items.find(i => i.id === itemId);
    if (item) { item.name = name; item.qty = qty; item.note = note; }
    showToast('物品已更新');
  } else {
    loc.items.push({ id: genId(), name, qty, note });
    showToast('物品已添加');
  }
  await saveData(appData);
  closeModal();
  render();
}

function deleteItem(locId, itemId) {
  const loc = appData.locations.find(l => l.id === locId);
  if (!loc || !loc.items) return;
  const item = loc.items.find(i => i.id === itemId);
  if (!item) return;
  showConfirm(`确定删除「${item.name}」？`, async () => {
    loc.items = loc.items.filter(i => i.id !== itemId);
    await saveData(appData);
    showToast('已删除');
    render();
  });
}

/* SECTION: utils */
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* SECTION: auto-refresh - poll for changes from other devices */
let _refreshTimer;
function startAutoRefresh() {
  _refreshTimer = setInterval(async () => {
    if (!isLoggedIn()) return;
    const fresh = await loadData();
    const freshStr = JSON.stringify(fresh);
    const curStr = JSON.stringify(appData);
    if (freshStr !== curStr) {
      appData = fresh;
      render();
    }
  }, 5000);
}

/* SECTION: init */
(async function() {
  if (isLoggedIn()) {
    await initApp();
  } else {
    render();
  }
  startAutoRefresh();
})();
</script>
</body>
</html>
